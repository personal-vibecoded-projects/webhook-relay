[project]
name = "webhook-relay-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "sqlalchemy", "alembic", "psycopg[binary]", "argon2-cffi"]

[dependency-groups]
dev = ["httpx2", "pytest", "ruff"]

[tool.pytest.ini_options]
addopts = "--assert=plain"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["database: requires an isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]
