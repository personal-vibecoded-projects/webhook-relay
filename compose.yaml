services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "relay_migrator", "-d", "relay"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  migrate:
    profiles: [tools]
    build:
      context: ./backend
      target: runtime
    command: [".venv/bin/python", "-m", "relay.migrate"]
    environment: &database_environment
      RELAY_DB_HOST: db
      RELAY_DB_NAME: relay
      RELAY_DB_USER: relay_migrator
      RELAY_DB_PASSWORD_FILE: /run/secrets/postgres_password
      RELAY_RUNTIME_PASSWORD_FILE: /run/secrets/runtime_password
    secrets:
      - postgres_password
      - runtime_password
    depends_on:
      db:
        condition: service_healthy
  database-tests:
    profiles: [test]
    build:
      context: ./backend
      target: database-tests
    environment:
      <<: *database_environment
      RUN_DATABASE_TESTS: "1"
    secrets:
      - postgres_password
      - runtime_password
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ./backend
      target: runtime
    environment:
      RELAY_DB_HOST: db
      RELAY_DB_NAME: relay
      RELAY_DB_USER: relay_app
      RELAY_DB_PASSWORD_FILE: /run/secrets/runtime_password
      RELAY_PUBLIC_ORIGIN: http://localhost:5173
      RELAY_ALLOW_HTTP_COOKIE: "1"
    secrets:
      - runtime_password
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  dashboard:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health', {signal: AbortSignal.timeout(2000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  runtime_password:
    file: ./.secrets/runtime_password
